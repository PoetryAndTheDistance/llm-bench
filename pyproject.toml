[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-bench"
version = "0.1.0"
description = "LLM API provider performance benchmark (TTFT, decode TPS, RPM/TPM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.scripts]
llm-bench = "llm_bench.cli:main"

[tool.setuptools.packages.find]
include = ["llm_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
